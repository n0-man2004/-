<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d0d11; /* Rich Deep Velvet Black */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            overflow: hidden;
            color: #ffffff;
            text-align: center;
            position: relative;
        }

        /* Subtle loving glow in background */
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 77, 109, 0.08) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* PAGE 1: Standard Glassmorphism Box */
        .container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            max-width: 85%;
            width: 400px;
            z-index: 10;
            transition: opacity 0.5s ease-in-out;
            position: relative;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #ff4d6d;
            margin-bottom: 30px;
        }

        /* Buttons Styling */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            height: 140px;
        }
